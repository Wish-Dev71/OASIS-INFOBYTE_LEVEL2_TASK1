<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcora | Smart Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="page">
    <header class="topbar">
      <a class="brand" href="#">Calcora<span>.</span></a>
      <span class="top-label">SMART CALCULATOR</span>
    </header>

    <section class="hero">
      <span class="eyebrow">SIMPLE. SMART. PRECISE.</span>
      <h1>Math made <span>easier.</span></h1>
      <p>A clean, modern calculator for your everyday calculations.</p>
    </section>

    <section class="calculator" aria-label="Calculator">
      <div class="calculator-heading">
        <div>
          <span class="small-label">YOUR CALCULATOR</span>
          <h2>Calculator</h2>
        </div>
        <span class="status-dot" title="Ready"></span>
      </div>

      <div class="display" aria-live="polite">
        <div class="expression" id="expression">Ready to calculate</div>
        <div class="result" id="display">0</div>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key-function" data-action="clear">AC</button>
        <button class="key key-function" data-action="backspace" aria-label="Delete last digit">⌫</button>
        <button class="key key-function" data-value="%">%</button>
        <button class="key key-operator" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key key-operator" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key key-operator" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key key-operator" data-value="+">+</button>

        <button class="key key-zero" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key key-equals" data-action="equals">=</button>
      </div>

      <p class="keyboard-tip">
        Tip: You can also use your keyboard to calculate.
      </p>
      <p class="error-message" id="error-message" role="alert"></p>
    </section>

    <footer>
      <p>Designed with care · <span>Calcora</span></p>
      <p>Oasis Infobyte · Level 2 · Task 1</p>
    </footer>
  </main>

</body>
</html>
